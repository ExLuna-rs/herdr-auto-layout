id = "auto-layout"
name = "Auto Layout"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Declarative layouts applied to every new workspace — cross-platform"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cargo", "build", "--release"]

[[startup]]
command = ["target/release/herdr-auto-layout", "startup"]
platforms = ["linux", "macos"]

[[startup]]
command = ["target/release/herdr-auto-layout.exe", "startup"]
platforms = ["windows"]

[[events]]
on = "workspace.created"
command = ["target/release/herdr-auto-layout", "on-event"]
platforms = ["linux", "macos"]

[[events]]
on = "workspace.created"
command = ["target/release/herdr-auto-layout.exe", "on-event"]
platforms = ["windows"]

[[actions]]
id = "apply"
title = "Apply layout to current workspace"
contexts = ["workspace"]
command = ["target/release/herdr-auto-layout", "apply"]
platforms = ["linux", "macos"]

[[actions]]
id = "apply-windows"
title = "Apply layout to current workspace"
contexts = ["workspace"]
command = ["target/release/herdr-auto-layout.exe", "apply"]
platforms = ["windows"]

[[actions]]
id = "validate"
title = "Validate layout config"
command = ["target/release/herdr-auto-layout", "validate"]
platforms = ["linux", "macos"]

[[actions]]
id = "validate-windows"
title = "Validate layout config"
command = ["target/release/herdr-auto-layout.exe", "validate"]
platforms = ["windows"]
